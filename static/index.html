<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSea Fish Detection AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <span class="icon">🌊</span>
                <h1>DeepSea AI</h1>
            </div>
            
            <form id="control-form">
                <div class="form-group">
                    <label for="tracker">Tracking Algorithm</label>
                    <select id="tracker" name="tracker">
                        <option value="botsort.yaml">BoT-SORT</option>
                        <option value="bytetrack.yaml">BYTETracker</option>
                        <option value="occlusion_botsort.yaml">BoT-SORT (Occlusion Tuned)</option>
                        <option value="deepsort">DeepSORT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="model_type">Detection Model</label>
                    <select id="model_type" name="model_type">
                        <!-- Populated via JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="conf">Confidence Threshold: <span id="conf-val">0.25</span></label>
                    <input type="range" id="conf" name="conf" min="0.1" max="1.0" step="0.05" value="0.25">
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="enhance" name="enhance" value="true">
                    <label for="enhance" style="margin: 0; font-weight: normal; font-size: 0.9rem;">Enable Image Preprocessing</label>
                </div>

                <div class="form-group">
                    <label for="sample_video">Sample Video</label>
                    <select id="sample_video" name="sample_video">
                        <option value="">-- Upload Custom Video --</option>
                        <!-- Populated via JS -->
                    </select>
                </div>

                <div class="form-group" id="upload-group">
                    <label for="video-upload" class="upload-btn">
                        <span>Upload Custom MP4</span>
                        <input type="file" id="video-upload" name="file" accept="video/mp4" />
                    </label>
                    <span id="file-name" class="file-name">No file chosen</span>
                </div>

                <button type="submit" class="btn primary-btn" id="start-btn">Start Analysis</button>
                <button type="button" class="btn danger-btn hidden" id="stop-btn">Stop</button>
            </form>

            <div class="info-box">
                <p>Enhancing frames with CLAHE and White Balance. YOLO handles detection and native trackers prevent double-counting.</p>
            </div>
        </aside>

        <!-- Main Dashboard -->
        <main class="main-content">
            <header class="top-bar glass-panel">
                <h2>Live Monitoring Feed</h2>
                <div class="status-indicator">
                    <span class="dot" id="status-dot"></span>
                    <span id="status-text">Standby</span>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Video Player -->
                <div class="video-container glass-panel">
                    <div class="placeholder" id="video-placeholder">
                        <span class="icon">🐟</span>
                        <p>Awaiting video source...</p>
                    </div>
                    <img id="video-feed" class="hidden" alt="Live Feed">
                </div>

                <!-- Stats Cards -->
                <div class="stats-container">
                    <div class="stat-card glass-panel count-card">
                        <h3>Total Fish Count</h3>
                        <div class="value pulse" id="stat-count">0</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <h3>Processed Frames</h3>
                        <div class="value" id="stat-frames">0</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <h3>Average FPS</h3>
                        <div class="value" id="stat-fps">0.00</div>
                    </div>
                </div>

                <!-- Graph -->
                <div class="chart-container glass-panel">
                    <h3>Population Count Over Time</h3>
                    <div class="canvas-wrapper">
                        <canvas id="countChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
